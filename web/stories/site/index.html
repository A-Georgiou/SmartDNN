<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartDNN Story GPT</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>SmartDNN Story GPT</h1>
    <p class="subtitle">A 5.9M-parameter GPT trained on <a href="https://huggingface.co/datasets/roneneldan/TinyStories">TinyStories</a> with <a href="https://github.com/A-Georgiou/SmartDNN">SmartDNN</a> on a laptop CPU and shipped as 6.6 MB of 8-bit weights. Start a story and it writes the rest one token at a time, running in your browser as WebAssembly.</p>

    <section class="panel">
      <label for="prompt">Story start</label>
      <textarea id="prompt" rows="2" spellcheck="false">Once upon a time, there was a little dog named Max.</textarea>
      <div class="examples">
        <button type="button" class="example">Lily and her mom went to the park.</button>
        <button type="button" class="example">Tom had a big red ball.</button>
        <button type="button" class="example">One day, a little bird could not fly.</button>
      </div>
      <div class="controls">
        <label>Temperature <input id="temperature" type="range" min="0.1" max="1.5" step="0.05" value="0.8"> <output id="temperature-value">0.80</output></label>
        <button id="generate" type="button" disabled>Write</button>
      </div>
      <span id="status">Loading model...</span>
    </section>

    <div id="output" class="panel" aria-live="polite"></div>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
